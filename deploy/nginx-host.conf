# Gaming Calls - Nginx Configuration
# Save as /etc/nginx/sites-available/gaming-calls
# Link to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name gaming-calls.local;  # Change to your domain
    
    # Redirect to HTTPS in production
    # return 301 https://$server_name$request_uri;
    
    root /var/www/gaming-calls/public;
    index index.php;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Hide version
    server_tokens off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;
    
    # Client max body size
    client_max_body_size 10M;
    
    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP processing
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;  # Adjust for your PHP version
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }
    
    # WebSocket proxy (for production with HTTPS/WSS)
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    
    # Deny access to sensitive files
    location ~ /\.(env|git|sql|log|md)$ {
        deny all;
    }
    
    location ~ composer\.(json|lock)$ {
        deny all;
    }
    
    location ^~ /config/ {
        deny all;
    }
    
    location ^~ /src/ {
        deny all;
    }
    
    location ^~ /database/ {
        deny all;
    }
    
    location ^~ /server/ {
        deny all;
    }
    
    location ^~ /vendor/ {
        deny all;
    }
    
    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

